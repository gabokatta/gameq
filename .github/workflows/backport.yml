name: Backport to develop

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  backport:
    name: Create backport PR
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Create backport PR
        uses: peter-evans/create-pull-request@v7
        with:
          branch: backport/${{ github.run_id }}
          base: develop
          title: "Backport main → develop (${{ github.event.head_commit.timestamp }})"
          body: "Automated backport of ${{ github.sha }} from main into develop."
          labels: backport
